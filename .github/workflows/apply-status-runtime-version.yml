name: Apply status runtime version patch

on:
  push:
    branches:
      - fix/status-runtime-version

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/status-runtime-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply 0.4.5 runtime status contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import textwrap

          ROOT = Path('.')
          SKILL = ROOT / 'skills' / 'content-marketing-workflow'

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {p}: {old[:160]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Entry point: /status must report the actually packaged Skill version.
          p = SKILL / 'SKILL.md'
          old = "For `/status`, always read the current project/profile state and `runtime-compatibility-matrix.md` before answering. Report overall `READY|DEGRADED|BLOCKED` compatibility plus feature-specific prerequisite blockers when they can be resolved. Include non-secret visual configuration summary when available: whether `visual_preferences`/`visual_identity` are configured, article logo policy, social logo policy, available logo variants and any `awaiting_brand_asset` blocker. When Telegram notifications are configured or enabled, include their non-secret configuration/health summary as defined by the status contract. `/status` itself remains read-only and must not send a Telegram test message; expose the explicit Telegram test command as the next action when a test is useful."
          new = "For `/status`, first read this installed Skill's packaged `VERSION` resource (the `VERSION` file beside `SKILL.md`) and report that exact trimmed value as the runtime Skill version. Also report the active distribution mode when it is actually knowable from the execution context: `Direct ChatGPT Skill`, `Codex plugin`, or `unknown`. Never infer the loaded runtime version from the product repository root `VERSION`, a GitHub tag/release, marketplace metadata, conversation memory or a newer remote source; if the packaged `VERSION` resource cannot be read, report the Skill version as `unknown` with a warning rather than substituting an external version. Then read the current project/profile state and `runtime-compatibility-matrix.md`. Report overall `READY|DEGRADED|BLOCKED` compatibility plus feature-specific prerequisite blockers when they can be resolved. Include non-secret visual configuration summary when available: whether `visual_preferences`/`visual_identity` are configured, article logo policy, social logo policy, available logo variants and any `awaiting_brand_asset` blocker. When Telegram notifications are configured or enabled, include their non-secret configuration/health summary as defined by the status contract. `/status` itself remains read-only and must not send a Telegram test message; expose the explicit Telegram test command as the next action when a test is useful."
          replace_once(p, old, new)

          # Command catalogue should describe runtime identity/version as part of /status.
          p = SKILL / 'docs/architecture/user-command-catalog.yaml'
          replace_once(
              p,
              '    summary: Show a read-only overview of durable project, integration, notification and workflow state.',
              '    summary: Show the loaded Skill runtime identity/version plus a read-only overview of durable project, integration, notification and workflow state.'
          )

          # System behavior: runtime identity is the first /status projection, before compatibility.
          p = SKILL / 'docs/architecture/user-command-system-behaviors.md'
          old = "`/status` is a read-only projection of durable current project/workflow state plus current runtime prerequisite availability where it can be inspected without mutation.\n\nIt must begin with a compatibility summary derived from `runtime-compatibility-matrix.md`:\n\n```text\nCompatibility: READY | DEGRADED | BLOCKED\n```"
          new = "`/status` is a read-only projection of the **currently loaded Skill runtime identity**, durable current project/workflow state and current runtime prerequisite availability where it can be inspected without mutation.\n\nIt must begin with runtime identity read from the installed package itself, followed by compatibility, for example:\n\n```text\nContent Marketing Workflow\nVersion Skill: 0.x.y\nDistribution: Direct ChatGPT Skill | Codex plugin | unknown\nCompatibility: READY | DEGRADED | BLOCKED\n```\n\nThe `Version Skill` value MUST be the exact trimmed contents of the packaged `VERSION` file beside the executing `SKILL.md`. That packaged resource is authoritative for **what this runtime has loaded**. Do not answer the runtime-version question by reading the product repository root `VERSION`, latest GitHub tag/release, marketplace metadata or conversation memory. A remote repository may legitimately be newer than the Skill currently loaded in the conversation. If the packaged `VERSION` resource is unavailable, report `Version Skill: unknown` plus a warning; do not substitute a remote version.\n\nDetermine `Distribution` only from the actual execution context. Use `Direct ChatGPT Skill` for a directly uploaded/installed ChatGPT Skill, `Codex plugin` for the mirrored Skill executing inside that plugin, and `unknown` when the surface does not expose enough evidence. Do not infer distribution merely from the existence of plugin files in GitHub.\n\nCompatibility remains derived from `runtime-compatibility-matrix.md`:"
          replace_once(p, old, new)

          # Runtime response contract: expose machine-representable runtime identity for /status only.
          p = SKILL / 'docs/architecture/user-command-runtime-contract.md'
          marker = "### `/status` and `/visual status`\n\nAt minimum the visual portion must be representable as:"
          insertion = """### `/status` runtime identity\n\nBefore project/integration state, `/status` must expose the identity of the **currently executing packaged Skill**:\n\n```yaml\nruntime:\n  skill_name: content-marketing-workflow\n  skill_version: <exact trimmed packaged VERSION|unknown>\n  version_source: packaged_skill_VERSION\n  distribution: direct_chatgpt_skill|codex_plugin|unknown\n  compatibility: READY|DEGRADED|BLOCKED\n  warnings: []\n```\n\n`skill_version` is read from the `VERSION` resource packaged beside the executing `SKILL.md`. It is not resolved from the product repository root, a GitHub tag/release, marketplace metadata or conversation memory. This distinction is mandatory because the remote source may be newer than the Skill loaded by the active conversation.\n\nIf the packaged version resource cannot be read, return `skill_version: unknown`, retain `version_source: packaged_skill_VERSION`, and add an explicit warning. Never silently substitute a remotely discovered version.\n\n`distribution` is derived only from real runtime context: `direct_chatgpt_skill` for a directly installed/uploaded ChatGPT Skill, `codex_plugin` for the mirrored Skill executing through the Codex plugin, otherwise `unknown`.\n\n`/status` remains read-only: reading packaged runtime metadata does not authorize installation, refresh, repository writes or any other mutation.\n\n### `/status` and `/visual status`\n\nAt minimum the visual portion must be representable as:"""
          text = p.read_text(encoding='utf-8')
          if marker not in text:
              raise SystemExit('runtime contract status marker missing')
          p.write_text(text.replace(marker, insertion, 1), encoding='utf-8')

          # Direct ChatGPT runtime contract: loaded package version is distinct from remote source version.
          p = SKILL / 'docs/architecture/chatgpt-skill-runtime.md'
          marker = "## `/start` in direct ChatGPT\n"
          insertion = """## Runtime identity and `/status`\n\nThe installed Skill package is self-identifying. Its runtime version authority is the packaged `VERSION` file beside `SKILL.md`.\n\nWhen `/status` executes, read that packaged resource and report its exact trimmed value. Do **not** fetch or infer the current runtime version from the product repository, latest GitHub release/tag, marketplace listing or conversation memory. Those external sources can describe what is available to install, but they do not prove what the active conversation has loaded.\n\nIf the packaged `VERSION` cannot be read in the active surface, report the runtime Skill version as `unknown` and explain that the loaded version cannot be proven. Never replace `unknown` with a remote repository version.\n\nThe distribution label is also runtime evidence: report `Direct ChatGPT Skill` when executing the directly installed/uploaded Skill, `Codex plugin` when executing the mirrored Skill through the plugin, otherwise `unknown`.\n\nThis runtime-identity read is side-effect free and does not refresh/reinstall the Skill.\n\n"""
          text = p.read_text(encoding='utf-8')
          if marker not in text:
              raise SystemExit('chatgpt runtime insertion marker missing')
          p.write_text(text.replace(marker, insertion + marker, 1), encoding='utf-8')

          # Version bump.
          (ROOT / 'VERSION').write_text('0.4.5\n', encoding='utf-8')
          (SKILL / 'VERSION').write_text('0.4.5\n', encoding='utf-8')

          # README.
          p = ROOT / 'README.md'
          replace_once(p, 'Current version: `0.4.4`', 'Current version: `0.4.5`')
          marker = "- Telegram remains optional and never changes publication truth.\n\n## Visual identity and branding"
          replacement = "- Telegram remains optional and never changes publication truth.\n\nVersion 0.4.5 makes `/status` self-identifying: it reports the Skill version from the `VERSION` resource embedded in the executing Skill package and reports the actual distribution mode when knowable. Remote GitHub/release metadata is explicitly not accepted as proof of the version loaded by the active conversation.\n\n## Visual identity and branding"
          replace_once(p, marker, replacement)

          # Changelog.
          p = ROOT / 'CHANGELOG.md'
          text = p.read_text(encoding='utf-8')
          marker = '## [Unreleased]\n\n'
          entry = """## [0.4.5] - 2026-09-07\n\n- Made `/status` report the version of the actually loaded Skill from the packaged `VERSION` resource beside `SKILL.md`.\n- Added explicit runtime distribution reporting: `Direct ChatGPT Skill`, `Codex plugin`, or `unknown` when the active surface cannot prove the mode.\n- Prohibited `/status` from substituting the repository root version, latest GitHub tag/release, marketplace metadata or conversation memory for the loaded runtime version.\n- Added a fail-honest `unknown` version state when the packaged version resource cannot be read.\n- Extended the `/status` response contract and command catalogue with runtime identity/version fields while preserving read-only behavior.\n- Added regression coverage for packaged-version authority, remote-version non-substitution, distribution reporting and version synchronization.\n- Bumped the Skill/Codex plugin version to 0.4.5 and synchronized the canonical Skill with the plugin mirror.\n\n"""
          if marker not in text:
              raise SystemExit('CHANGELOG marker missing')
          p.write_text(text.replace(marker, marker + entry, 1), encoding='utf-8')

          # Plugin manifest version.
          p = ROOT / 'plugins/content-marketing-workflow/.codex-plugin/plugin.json'
          data = json.loads(p.read_text(encoding='utf-8'))
          data['version'] = '0.4.5'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Regression test.
          test = textwrap.dedent(r'''
              import json
              import unittest
              from pathlib import Path

              ROOT = Path(__file__).resolve().parents[1]
              SKILL = ROOT / "skills" / "content-marketing-workflow"
              PLUGIN_SKILL = ROOT / "plugins" / "content-marketing-workflow" / "skills" / "content-marketing-workflow"


              class StatusRuntimeIdentityTests(unittest.TestCase):
                  def test_status_uses_packaged_version_as_runtime_authority(self):
                      entrypoint = (SKILL / "SKILL.md").read_text()
                      behaviors = (SKILL / "docs" / "architecture" / "user-command-system-behaviors.md").read_text()
                      runtime = (SKILL / "docs" / "architecture" / "user-command-runtime-contract.md").read_text()
                      direct = (SKILL / "docs" / "architecture" / "chatgpt-skill-runtime.md").read_text()

                      self.assertIn("packaged `VERSION`", entrypoint)
                      self.assertIn("Version Skill: 0.x.y", behaviors)
                      self.assertIn("skill_version: <exact trimmed packaged VERSION|unknown>", runtime)
                      self.assertIn("version_source: packaged_skill_VERSION", runtime)
                      self.assertIn("runtime version authority is the packaged `VERSION`", direct)

                  def test_status_must_not_substitute_remote_version(self):
                      entrypoint = (SKILL / "SKILL.md").read_text()
                      behaviors = (SKILL / "docs" / "architecture" / "user-command-system-behaviors.md").read_text()
                      runtime = (SKILL / "docs" / "architecture" / "user-command-runtime-contract.md").read_text()

                      self.assertIn("Never infer the loaded runtime version from the product repository root `VERSION`", entrypoint)
                      self.assertIn("If the packaged `VERSION` resource is unavailable, report `Version Skill: unknown`", behaviors)
                      self.assertIn("Never silently substitute a remotely discovered version", runtime)

                  def test_status_reports_distribution_from_runtime_context_only(self):
                      behaviors = (SKILL / "docs" / "architecture" / "user-command-system-behaviors.md").read_text()
                      runtime = (SKILL / "docs" / "architecture" / "user-command-runtime-contract.md").read_text()
                      catalog = (SKILL / "docs" / "architecture" / "user-command-catalog.yaml").read_text()

                      self.assertIn("Direct ChatGPT Skill | Codex plugin | unknown", behaviors)
                      self.assertIn("distribution: direct_chatgpt_skill|codex_plugin|unknown", runtime)
                      self.assertIn("loaded Skill runtime identity/version", catalog)

                  def test_045_version_is_synchronized(self):
                      root_version = (ROOT / "VERSION").read_text().strip()
                      skill_version = (SKILL / "VERSION").read_text().strip()
                      plugin_skill_version = (PLUGIN_SKILL / "VERSION").read_text().strip()
                      manifest = json.loads((ROOT / "plugins" / "content-marketing-workflow" / ".codex-plugin" / "plugin.json").read_text())

                      self.assertEqual("0.4.5", root_version)
                      self.assertEqual(root_version, skill_version)
                      self.assertEqual(root_version, plugin_skill_version)
                      self.assertEqual(root_version, manifest["version"])


              if __name__ == "__main__":
                  unittest.main()
          ''').lstrip()
          (ROOT / 'tests/test_status_runtime_identity.py').write_text(test, encoding='utf-8')
          PY
      - name: Synchronize canonical Skill into plugin mirror
        run: python3 tools/sync-skill-mirror.py
      - name: Validate product patch
        run: |
          python3 tests/test_status_runtime_identity.py
          python3 tests/test_repository.py
          python3 tests/test_visual_brand_contract.py
          python3 tests/test_visual_review_gate.py
          python3 tests/test_base_generation_brief.py
          python3 tests/test_single_visual_approval.py
          python3 tests/test_dropbox_contract.py
          python3 tools/build-skill.py
          python3 tools/build-release.py --source-sha "$(git rev-parse HEAD)"
      - name: Commit product changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION README.md CHANGELOG.md tests/test_status_runtime_identity.py skills/content-marketing-workflow plugins/content-marketing-workflow
          git commit -m "fix: report packaged skill version in status"
          git push origin HEAD:fix/status-runtime-version
