name: Build tagged release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tag equals VERSION
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          python3 tests/test_repository.py
      - name: Build Codex plugin release
        run: python3 tools/build-release.py --source-sha "$GITHUB_SHA"
      - name: Build direct ChatGPT Skill release
        run: python3 tools/build-skill.py
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          for artifact in \
            "build/content-marketing-workflow-${version}.zip" \
            "build/content-marketing-workflow-${version}.skill" \
            "build/content-marketing-workflow-skill-${version}.zip"; do
            sha256sum "$artifact" > "${artifact}.sha256"
          done
          gh release create "$GITHUB_REF_NAME" \
            "build/content-marketing-workflow-${version}.zip" \
            "build/content-marketing-workflow-${version}.zip.sha256" \
            "build/content-marketing-workflow-${version}.skill" \
            "build/content-marketing-workflow-${version}.skill.sha256" \
            "build/content-marketing-workflow-skill-${version}.zip" \
            "build/content-marketing-workflow-skill-${version}.zip.sha256" \
            --title "Content Marketing Workflow ${version}" \
            --generate-notes
