name: Sanitize generic repository boundary

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sanitize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generic privacy test
        run: cp tools/test_repository_generic.py tests/test_repository.py
      - name: Sanitize canonical source
        run: python3 tools/sanitize-generic-boundary.py
      - name: Validate sanitized source
        run: python3 tests/test_repository.py
      - name: Commit sanitation when needed
        run: |
          if git diff --quiet; then
            echo 'No sanitation changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove remaining pilot and personal data from canonical source'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
