name: Test Content Marketing Workflow

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical repository
        run: python3 tests/test_repository.py
      - name: Validate visual and brand contracts
        run: python3 tests/test_visual_brand_contract.py
      - name: Validate review-ready visual branding gate
        run: python3 tests/test_visual_review_gate.py
      - name: Validate brand-isolated base generation briefs
        run: python3 tests/test_base_generation_brief.py
      - name: Validate single social visual approval gate
        run: python3 tests/test_single_visual_approval.py
      - name: Validate transient image rendering compatibility
        run: python3 tests/test_transient_image_rendering.py
      - name: Validate social check readiness layers
        run: python3 tests/test_social_check_readiness_layers.py
      - name: Validate status runtime identity/version
        run: python3 tests/test_status_runtime_identity.py
      - name: Validate active project repository status
        run: python3 tests/test_status_project_repository.py
      - name: Validate Dropbox provider contracts
        run: python3 tests/test_dropbox_contract.py
      - name: Build exact plugin artifact
        run: python3 tools/build-release.py --source-sha "$GITHUB_SHA"
      - name: Build direct ChatGPT Skill artifacts
        run: python3 tools/build-skill.py
      - name: Verify plugin ZIP integrity
        run: unzip -t "build/content-marketing-workflow-$(cat VERSION).zip"
      - name: Verify Skill bundle integrity
        run: |
          unzip -t "build/content-marketing-workflow-$(cat VERSION).skill"
          unzip -t "build/content-marketing-workflow-skill-$(cat VERSION).zip"
      - name: Emit SHA-256
        run: |
          sha256sum "build/content-marketing-workflow-$(cat VERSION).zip"
          sha256sum "build/content-marketing-workflow-$(cat VERSION).skill"
          sha256sum "build/content-marketing-workflow-skill-$(cat VERSION).zip"
      - name: Upload installable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: content-marketing-workflow-${{ github.sha }}
          path: |
            build/content-marketing-workflow-*.zip
            build/content-marketing-workflow-*.skill
          if-no-files-found: error
          retention-days: 30

  codex-marketplace-install:
    runs-on: ubuntu-latest
    env:
      CODEX_HOME: /tmp/content-marketing-workflow-codex-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.153.2
      - name: Show Codex version
        run: codex --version
      - name: Add repository as local marketplace
        run: |
          rm -rf "$CODEX_HOME"
          mkdir -p "$CODEX_HOME"
          codex plugin marketplace add . --json
      - name: Install plugin from marketplace
        run: codex plugin add content-marketing-workflow@content-marketing-workflow --json
      - name: Verify marketplace and plugin discovery
        run: |
          codex plugin marketplace list --json
          codex plugin list --marketplace content-marketing-workflow --json
