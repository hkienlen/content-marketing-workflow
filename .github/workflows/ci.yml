name: Test Content Marketing Workflow

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical repository
        run: python3 tests/test_repository.py
      - name: Build exact plugin artifact
        run: python3 tools/build-release.py --source-sha "$GITHUB_SHA"
      - name: Verify ZIP integrity
        run: unzip -t "build/content-marketing-workflow-$(cat VERSION).zip"
      - name: Emit SHA-256
        run: sha256sum "build/content-marketing-workflow-$(cat VERSION).zip"
      - name: Upload installable plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: content-marketing-workflow-${{ github.sha }}
          path: build/content-marketing-workflow-*.zip
          if-no-files-found: error
          retention-days: 30

  codex-marketplace-install:
    runs-on: ubuntu-latest
    env:
      CODEX_HOME: /tmp/content-marketing-workflow-codex-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.153.2
      - name: Show Codex version
        run: codex --version
      - name: Add repository as local marketplace
        run: |
          rm -rf "$CODEX_HOME"
          mkdir -p "$CODEX_HOME"
          codex plugin marketplace add . --json
      - name: Install plugin from marketplace
        run: codex plugin add content-marketing-workflow@content-marketing-workflow --json
      - name: Verify marketplace and plugin discovery
        run: |
          codex plugin marketplace list --json
          codex plugin list --marketplace content-marketing-workflow --json
