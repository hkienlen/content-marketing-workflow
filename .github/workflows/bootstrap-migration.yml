name: Bootstrap canonical source migration

on:
  push:
    branches:
      - migration/import-canonical-source
    paths:
      - '.migration/READY'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/import-canonical-source
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize canonical plugin source
        env:
          SOURCE_ARTIFACT_URL: 'https://productionresultssa1.blob.core.windows.net/actions-results/5445aa0d-a60c-4394-9fe7-54a975989629/workflow-job-run-d6564aff-a393-5140-9a73-4d4364851fe0/artifacts/33910a15afa7cc92934a3dcffcdf7a079202edfb7b4a92ba89eff2097ab50583.zip?rscd=attachment%3B+filename%3D%22content-marketing-workflow-0.1.0-d89d1de1c2cbb47b68a75d3923003624e027cfc5.zip%22&rsct=application%2Fzip&se=2026-09-04T19%3A43%3A07Z&sig=6TIHNIcbYxK72qhnvWdi28%2Feie1cNjrCSFW%2BG96awx0%3D&ske=2026-09-04T21%3A11%3A01Z&skoid=ca7593d4-ee42-46cd-af88-8b886a2f84eb&sks=b&skt=2026-09-04T17%3A11%3A01Z&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skv=2025-11-05&sp=r&spr=https&sr=b&st=2026-09-04T19%3A33%3A02Z&sv=2025-11-05'
        run: |
          python3 .migration/migrate.py
          rm -rf .migration
      - name: Validate migrated canonical source
        run: |
          python3 tests/test_repository.py
          python3 tools/build-release.py --source-sha "$GITHUB_SHA"
          unzip -t "build/content-marketing-workflow-$(cat VERSION).zip"
      - name: Commit final canonical source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import Content Marketing Workflow 0.1.0 canonical source'
          git push origin HEAD:migration/import-canonical-source
