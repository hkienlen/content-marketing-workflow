name: Apply 0.4.8 product patch

on:
  push:
    branches:
      - fix/social-check-readiness-048
    paths:
      - '.github/workflows/apply-048-product-only.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/social-check-readiness-048
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract and apply product patch
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /^          cat > \/tmp\/apply_048.py <<'\''PY'\''$/ {flag=1; next}
            /^          PY$/ {flag=0}
            flag {sub(/^          /, ""); print}
          ' .github/workflows/apply-048-social-check-readiness.yml > /tmp/apply_048.py
          test -s /tmp/apply_048.py
          python3 /tmp/apply_048.py
          python3 tools/sync-skill-mirror.py
          rm -f skills/content-marketing-workflow/docs/architecture/user-command-catalogue.yaml
          rm -f plugins/content-marketing-workflow/skills/content-marketing-workflow/docs/architecture/user-command-catalogue.yaml
          git checkout -- .github/workflows/ci.yml
      - name: Validate product patch
        run: |
          python3 tests/test_social_check_readiness_layers.py
          python3 tests/test_repository.py
          python3 tests/test_single_visual_approval.py
          python3 tests/test_transient_image_rendering.py
          python3 tests/test_status_runtime_identity.py
          python3 tests/test_status_project_repository.py
          python3 tools/build-release.py --source-sha "$GITHUB_SHA"
          python3 tools/build-skill.py
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A VERSION README.md CHANGELOG.md tests/test_social_check_readiness_layers.py skills/content-marketing-workflow plugins/content-marketing-workflow
          git commit -m "fix: separate social readiness from execution gates"
          git push origin HEAD:fix/social-check-readiness-048
