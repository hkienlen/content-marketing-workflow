name: Apply single social visual approval patch

on:
  push:
    branches:
      - fix/single-social-visual-approval

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/single-social-visual-approval
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply 0.4.4 UX contract patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import textwrap

          ROOT = Path('.')
          SKILL = ROOT / 'skills' / 'content-marketing-workflow'

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected text in {p}: {old[:120]!r}')
              text = text.replace(old, new, 1)
              p.write_text(text)

          p = SKILL / 'docs/architecture/capabilities/social-create-visual.md'
          replace_once(p, '= may be inspected/discussed transiently', '= strictly internal implementation artifact; not shown to the user in the normal workflow')
          replace_once(p,
              'If official-logo composition cannot be completed, base generation may continue for exploration, but the workflow must not persist/present the outputs as selectable A/B/C, must not record a durable visual selection, and must not set combined review to fully approved.',
              'If official-logo composition cannot be completed, base generation may continue internally for exploration, but the workflow must not present those base drafts to the user as a normal review step, must not persist/present them as selectable A/B/C, must not record a durable visual selection, and must not set combined review to fully approved.')
          replace_once(p,
              'A raw generator output is not automatically a review proposal. The executor may create or persist internal drafts as implementation detail, but only gate-passing branded derivatives count as A/B/C when `logo_application=always`.',
              'A raw generator output is not automatically a review proposal. The executor may create or persist internal drafts as implementation detail, but those clean bases stay internal in the normal user journey. Only gate-passing branded derivatives count as A/B/C when `logo_application=always`; the user is not asked to approve an unbranded base before seeing the branded A/B/C package.')
          replace_once(p,
              'For `logo_application=always`, the candidate shown and selected by the user is the actual official-logo composition. The visual state must not claim `selected`, `visual_approved_text_pending`, `fully_approved`, or an equivalent durable visual approval when the displayed candidate failed the review-ready brand gate.\n\nText approval remains independently preservable during a branding repair.',
              'For `logo_application=always`, the candidate shown and selected by the user is the actual official-logo composition. The visual state must not claim `selected`, `visual_approved_text_pending`, `fully_approved`, or an equivalent durable visual approval when the displayed candidate failed the review-ready brand gate.\n\nThe explicit selection of one review-ready branded A/B/C candidate is the human visual approval for that visual revision. Normal non-material finalization after that selection must proceed automatically and must not ask for a second visual approval. A targeted re-confirmation is required only when finalization would materially alter what the user selected, such as a meaningful crop, logo reposition/variant change, visible-text change, creative retouch or other perceptible composition change.\n\nText approval remains independently preservable during a branding repair.')
          replace_once(p,
              'After a compliant human selection, invoke `asset-ingest`.\n\nBefore `verified_final` verify normalization, source fidelity/provenance, effective social logo rule, exact official logo identity/version, exact final bytes/hash and the same effective-contract revision.',
              'After a compliant human selection, invoke `asset-ingest` automatically. Do not introduce another approval gate for normalization, encoding, naming, hashing, provider storage or metadata work that preserves the selected visible composition.\n\nBefore `verified_final` verify normalization, source fidelity/provenance, effective social logo rule, exact official logo identity/version, exact final bytes/hash and the same effective-contract revision. If finalization cannot preserve the reviewed visual materially, stop before `verified_final`, produce the narrowest required changed candidate and request targeted re-confirmation of that changed visual only.')

          p = SKILL / 'docs/architecture/social-post-review-loop.md'
          replace_once(p,
              'An unbranded base or a visual containing generated/unverified project branding may be discussed as a concept draft, but it must not receive durable selection or combined approval.',
              'An unbranded base or a visual containing generated/unverified project branding remains internal and is not shown in the normal review flow. It may be exposed only when the user explicitly asks to inspect/debug intermediate generation artifacts, and it must never receive durable selection or combined approval.')
          marker = '### Exact `use_as_is` package\n'
          insertion = '''### Single human visual approval gate\n\nFor generated/materially transformed social posts, the normal user journey has **one visual approval gate**. The user reviews the actual publishable-basis A/B/C visuals, including the exact official logo when required, and selection of one compliant candidate is the visual approval for that revision.\n\nNon-material finalization after selection is automatic. Resizing/normalization that preserves composition, format encoding, quality optimization without perceptible design change, canonical naming, hashing, provider storage, ALT/metadata persistence and other technical packaging must not trigger a second visual approval request.\n\nIf finalization requires a material visible change relative to the selected candidate, such as meaningful crop/reframe, logo move/resize/variant change, visible-text alteration, creative retouch or another perceptible composition change, only that changed visual is reopened for targeted re-confirmation. A full A/B/C restart is not required unless the concept materially changes or the user requests it.\n\n'''
          text = p.read_text()
          if marker not in text:
              raise SystemExit('review-loop insertion marker missing')
          p.write_text(text.replace(marker, insertion + marker, 1))
          replace_once(p,
              'After selection, `asset-ingest` normalizes/verifies final according to media architecture. Combined approval is not scheduling or publication authorization.',
              'After selection, `asset-ingest` normalizes/verifies final according to media architecture. When that finalization is non-material, it proceeds without another human visual approval and the system reports the resulting `verified_final` state. Combined approval is not scheduling or publication authorization.')

          p = SKILL / 'docs/architecture/capabilities/asset-ingest.md'
          replace_once(p,
              '  - explicit final candidate/source selection before finalization\n  - explicit replacement intent before replacing a different verified final asset',
              '  - explicit final candidate/source selection before finalization\n  - no second human approval after a compliant review-ready social candidate selection when finalization is non-material\n  - targeted re-confirmation only when finalization materially changes the selected visible result\n  - explicit replacement intent before replacing a different verified final asset')
          replace_once(p,
              '-> required exact brand composition/verification\n-> normalized',
              '-> required exact brand composition/verification if not already satisfied before selection\n-> normalized')
          marker = '## Idempotency and replacement protection\n'
          insertion = '''## Human approval and material-change boundary\n\nFor a social visual selected from a review-ready A/B/C package, the selection already constitutes human visual approval of the visible publishable basis. `asset-ingest` must not ask the user to approve the same visual again merely because bytes change through non-material technical finalization.\n\nNon-material finalization includes operations such as orientation normalization, dimension normalization that preserves the reviewed composition, JPEG/PNG encoding, quality optimization without perceptible design change, canonical naming, hashing, provider storage and metadata persistence. These operations proceed automatically to `verified_final` when all deterministic checks pass.\n\nA second, targeted visual confirmation is required only when finalization changes the reviewed visible result materially. Examples include a meaningful crop/reframe, logo position/size/variant change, visible-text change, creative retouch, source substitution or another perceptible composition change. Stop before `verified_final`, surface the changed candidate, preserve unaffected approvals, and request confirmation only for that changed visual.\n\n'''
          text = p.read_text()
          if marker not in text:
              raise SystemExit('asset-ingest insertion marker missing')
          p.write_text(text.replace(marker, insertion + marker, 1))
          replace_once(p, '-> user reviews result', '-> system reports the verified_final result without requesting another approval')

          p = SKILL / 'docs/architecture/social-execution-checklist.md'
          replace_once(p,
              '- generated outputs are **base drafts, not A/B/C review candidates** until every pre-review invariant is satisfied;',
              '- generated outputs are **base drafts, not A/B/C review candidates** until every pre-review invariant is satisfied; in the normal user journey these bases remain internal and are not shown for approval;')
          replace_once(p,
              '- the actual official-logo composition when effective `always` policy requires branded final;',
              '- the actual official-logo composition when effective `always` policy requires branded final;\n- no intermediate approval of unbranded clean bases before this combined review;\n- choosing one compliant branded A/B/C is the human visual approval for that revision;')
          replace_once(p,
              '- full-quality bytes resolved;\n- final normalized to current social dimensions/format policy without overwriting source original;',
              '- full-quality bytes resolved;\n- final normalized to current social dimensions/format policy without overwriting source original;\n- non-material normalization/encoding/storage after selection proceeds without a second human approval request;\n- if finalization requires a material visible change, stop before `verified_final` and request targeted re-confirmation of the changed visual only;')

          p = SKILL / 'SKILL.md'
          replace_once(p,
              '8. generate and inspect clean base drafts; for disposable pure-AI bases, reject/regenerate accidental pseudo-branding by default instead of starting a logo-removal edit cycle;',
              '8. generate and inspect clean base drafts internally; do not show or ask the user to approve those bases in the normal workflow; for disposable pure-AI bases, reject/regenerate accidental pseudo-branding by default instead of starting a logo-removal edit cycle;')
          replace_once(p,
              '11. verify effective source/brand contract before `verified_final`.',
              '11. verify effective source/brand contract before `verified_final`.\n\nFor social posts, selecting a review-ready branded A/B/C candidate is the human visual approval for that revision. Non-material finalization after selection proceeds automatically and must not create a second visual-approval step. Re-open only the changed visual for targeted confirmation when finalization materially changes what the user reviewed.')

          (ROOT / 'VERSION').write_text('0.4.4\n')
          (SKILL / 'VERSION').write_text('0.4.4\n')

          p = ROOT / 'README.md'
          text = p.read_text()
          text = text.replace('Current version: `0.4.3`', 'Current version: `0.4.4`', 1)
          old = 'Version 0.4.3 separates image-model input from brand composition: the generator receives a brand-isolated base brief, never the full logo contract or asset identity, and contaminated disposable AI bases are rejected/regenerated by default rather than entering a remove-logo/re-add-logo loop.'
          new = old + ' Version 0.4.4 restores the pilot-style single-review UX: internal clean bases are never a normal approval step, users select from already compliant/branded A/B/C, and non-material finalization proceeds automatically without a redundant second visual approval.'
          if old not in text:
              raise SystemExit('README 0.4.3 branding sentence missing')
          p.write_text(text.replace(old, new, 1))

          p = ROOT / 'CHANGELOG.md'
          text = p.read_text()
          marker = '## [Unreleased]\n\n'
          entry = '''## [0.4.4] - 2026-09-07\n\n- Restored the pilot-style single visual approval UX for social posts: clean/unbranded generation bases remain internal and the first normal visual review shows only review-ready A/B/C.\n- Made selection of one compliant branded A/B/C candidate the human visual approval for that revision.\n- Removed the redundant post-finalization approval step for non-material normalization, encoding, naming, hashing, cloud storage and metadata operations.\n- Added a material-change boundary: meaningful crop/reframe, logo placement/variant changes, visible-text edits, creative retouch or other perceptible composition changes require targeted re-confirmation of only the changed visual.\n- Added regression coverage enforcing one normal social visual approval gate while preserving exact-logo and deterministic finalization safeguards.\n- Bumped the Skill/Codex plugin version to 0.4.4 and synchronized the canonical Skill with the plugin mirror.\n\n'''
          if marker not in text:
              raise SystemExit('CHANGELOG marker missing')
          p.write_text(text.replace(marker, marker + entry, 1))

          p = ROOT / 'plugins/content-marketing-workflow/.codex-plugin/plugin.json'
          data = json.loads(p.read_text())
          data['version'] = '0.4.4'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          test = textwrap.dedent(r'''
              import unittest
              from pathlib import Path

              ROOT = Path(__file__).resolve().parents[1]
              SKILL = ROOT / "skills" / "content-marketing-workflow"

              class SingleSocialVisualApprovalTests(unittest.TestCase):
                  def test_clean_bases_are_internal_and_branded_candidates_are_first_review(self):
                      social = (SKILL / "docs" / "architecture" / "capabilities" / "social-create-visual.md").read_text()
                      review = (SKILL / "docs" / "architecture" / "social-post-review-loop.md").read_text()
                      checklist = (SKILL / "docs" / "architecture" / "social-execution-checklist.md").read_text()
                      entrypoint = (SKILL / "SKILL.md").read_text()
                      self.assertIn("strictly internal implementation artifact", social)
                      self.assertIn("not asked to approve an unbranded base", social)
                      self.assertIn("one visual approval gate", review)
                      self.assertIn("no intermediate approval of unbranded clean bases", checklist)
                      self.assertIn("do not show or ask the user to approve those bases", entrypoint)

                  def test_branded_selection_is_visual_approval_and_non_material_finalization_is_automatic(self):
                      social = (SKILL / "docs" / "architecture" / "capabilities" / "social-create-visual.md").read_text()
                      review = (SKILL / "docs" / "architecture" / "social-post-review-loop.md").read_text()
                      ingest = (SKILL / "docs" / "architecture" / "capabilities" / "asset-ingest.md").read_text()
                      checklist = (SKILL / "docs" / "architecture" / "social-execution-checklist.md").read_text()
                      self.assertIn("selection of one review-ready branded A/B/C candidate is the human visual approval", social)
                      self.assertIn("Non-material finalization", review)
                      self.assertIn("must not ask the user to approve the same visual again", ingest)
                      self.assertIn("without requesting another approval", ingest)
                      self.assertNotIn("-> user reviews result", ingest)
                      self.assertIn("without a second human approval request", checklist)

                  def test_material_changes_require_only_targeted_reconfirmation(self):
                      review = (SKILL / "docs" / "architecture" / "social-post-review-loop.md").read_text()
                      ingest = (SKILL / "docs" / "architecture" / "capabilities" / "asset-ingest.md").read_text()
                      social = (SKILL / "docs" / "architecture" / "capabilities" / "social-create-visual.md").read_text()
                      for text in (review, ingest, social):
                          self.assertIn("targeted re-confirmation", text)
                      self.assertIn("meaningful crop/reframe", review)
                      self.assertIn("logo position/size/variant change", ingest)

              if __name__ == "__main__":
                  unittest.main()
          ''').lstrip()
          (ROOT / 'tests/test_single_visual_approval.py').write_text(test)

          p = ROOT / '.github/workflows/ci.yml'
          text = p.read_text()
          needle = '      - name: Validate brand-isolated base generation briefs\n        run: python3 tests/test_base_generation_brief.py\n'
          addition = needle + '      - name: Validate single social visual approval gate\n        run: python3 tests/test_single_visual_approval.py\n'
          if needle not in text:
              raise SystemExit('CI insertion marker missing')
          p.write_text(text.replace(needle, addition, 1))
          PY
      - name: Synchronize canonical Skill into plugin mirror
        run: python3 tools/sync-skill-mirror.py
      - name: Validate patch before commit
        run: |
          python3 tests/test_single_visual_approval.py
          python3 tests/test_repository.py
          python3 tests/test_visual_brand_contract.py
          python3 tests/test_visual_review_gate.py
          python3 tests/test_base_generation_brief.py
          python3 tests/test_dropbox_contract.py
      - name: Remove one-off patch workflow and commit product changes
        run: |
          rm .github/workflows/apply-single-visual-approval.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use one social visual approval gate"
          git push origin HEAD:fix/single-social-visual-approval
